<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit FIR - WAKAD POLICE STATION</title>
    <style>
        body {
            background: linear-gradient(to bottom right, #2e2e5e, #8576aa);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: yellow;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .station-name {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ff5e78;
        }

        form {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0px 0px 15px #00000080;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        button {
            background-color: #00adb5;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #027a80;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            color: #8be9fd;
            text-decoration: none;
            font-size: 1rem;
        }

        .back-link:hover {
            text-decoration: underline;
            color: #ffcc70;
        }
    </style>
</head>
<body>

    <h1>Edit FIR</h1>
    <div class="station-name">🚨 WAKAD POLICE STATION</div>

    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ fir[1] }}" required>

        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" value="{{ fir[2] }}" required>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" value="{{ fir[3] }}" required>

        <label for="complaint">Complaint:</label>
        <input type="text" id="complaint" name="complaint" value="{{ fir[4] }}" required>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="{{ fir[6] }}" required>


        <label for="status">Status:</label>
        <select id="status" name="status">
            <option value="Pending" {% if fir[5] == 'Pending' %}selected{% endif %}>Pending</option>
            <option value="Solved" {% if fir[5] == 'Solved' %}selected{% endif %}>Solved</option>
        </select>

        <button type="submit">Update FIR</button>
    </form>

    <a href="/view_fir" class="back-link">🔙 Back to Reports</a>

</body>
</html>
